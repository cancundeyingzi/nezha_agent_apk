name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege, stated explicitly: this workflow only ever reads the repository. Without the
# block, the job inherits whatever the repository default is — which for older repositories is
# read/write on every scope, handing a compromised build step a token that can push.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      # R8 runs only in the release build, and its keep rules are the kind of thing that breaks
      # without anyone noticing until an install fails. Build it on every change.
      - name: Release build
        run: ./gradlew :app:assembleRelease

      # Non-blocking for now — see the `lint` block in app/build.gradle.kts. This run exists to
      # produce the first baseline; the step turns into a real gate once that baseline is triaged.
      - name: Android lint
        run: ./gradlew :app:lintRelease

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/
            core/build/reports/tests/
            app/build/reports/lint-results-release.html
          retention-days: 7
