# Single source of truth for dependency and plugin versions.
#
# This file was introduced purely to gather the literals that were spread across the three build
# scripts (junit alone was declared twice, at different call sites but the same version). Every
# version below is the one the build already resolved to — nothing was upgraded while moving it
# here, so a `dependencies` diff between this commit and its parent should be empty.
#
# Upgrading AGP/Kotlin/Compose is deliberately a separate change: it alters generated code and
# lint output, and reviewing that alongside a mechanical move would hide one in the other.

[versions]
agp = "8.6.0"
kotlin = "1.9.22"
protobufPlugin = "0.9.4"

# Must stay compatible with `kotlin` above — the Compose compiler extension is versioned against
# the Kotlin compiler, not against composeBom.
composeCompiler = "1.5.8"
composeBom = "2024.02.00"

androidxCore = "1.12.0"
androidxLifecycle = "2.7.0"
androidxActivity = "1.8.2"
# Alpha on purpose: it is the last published security-crypto line, and it is used read-only to
# import the legacy EncryptedSharedPreferences store.
androidxSecurityCrypto = "1.1.0-alpha06"

okhttp = "4.12.0"
grpc = "1.62.2"
grpcKotlin = "1.4.1"
protobuf = "3.25.3"
shizuku = "13.1.5"
tomcatAnnotations = "6.0.53"
junit = "4.13.2"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidxLifecycle" }
androidx-activity-ktx = { module = "androidx.activity:activity-ktx", version.ref = "androidxActivity" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "androidxSecurityCrypto" }

# Versionless by design: compose-bom pins them, exactly as the literal declarations did.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }

grpc-okhttp = { module = "io.grpc:grpc-okhttp", version.ref = "grpc" }
grpc-protobuf-lite = { module = "io.grpc:grpc-protobuf-lite", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-kotlin-stub = { module = "io.grpc:grpc-kotlin-stub", version.ref = "grpcKotlin" }
protobuf-javalite = { module = "com.google.protobuf:protobuf-javalite", version.ref = "protobuf" }

shizuku-api = { module = "dev.rikka.shizuku:api", version.ref = "shizuku" }
shizuku-provider = { module = "dev.rikka.shizuku:provider", version.ref = "shizuku" }

# compileOnly, only so generated gRPC/protobuf sources can see javax.annotation.Generated.
tomcat-annotations-api = { module = "org.apache.tomcat:annotations-api", version.ref = "tomcatAnnotations" }

junit = { module = "junit:junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
protobuf = { id = "com.google.protobuf", version.ref = "protobufPlugin" }
